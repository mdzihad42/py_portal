{% extends "base.html" %}
{% block title %}Delete Debate — NSDA Portal{% endblock %}
{% block page_title %}Delete Debate{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-body text-center" style="padding:48px;">
        <div style="font-size:48px;color:var(--danger);margin-bottom:16px;"><i class="fas fa-exclamation-triangle"></i></div>
        <h2>Delete "{{ object.title }}"?</h2>
        <p class="text-muted mt-16">This action cannot be undone. All registrations and results will be lost.</p>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;">
            <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button></form>
            <a href="{% url 'debates:detail' object.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
