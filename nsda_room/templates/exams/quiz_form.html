{% extends "base.html" %}
{% block title %}Create Exam — NSDA Portal{% endblock %}
{% block page_title %}Create New Exam{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header"><h3><i class="fas fa-file-signature"></i> Exam Details</h3></div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group mb-16">
                <label>Exam Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Weekly Python Quiz" required>
            </div>
            <div class="form-group mb-16">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Explain what this exam is about..."></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group mb-16">
                    <label>Duration (Minutes)</label>
                    <input type="number" name="duration_minutes" class="form-control" value="30" required>
                </div>
                <div class="form-group mb-16">
                    <label>Total Marks</label>
                    <input type="number" name="total_marks" class="form-control" value="10" required>
                </div>
            </div>
            <div style="margin-top:24px;display:flex;gap:12px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Create Exam</button>
                <a href="{% url 'exams:teacher_quiz_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
